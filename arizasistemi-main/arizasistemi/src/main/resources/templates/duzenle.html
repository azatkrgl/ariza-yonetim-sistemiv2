<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arıza Kaydını Düzenle</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f9; color: #333; }
        .navbar-custom { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .terminal-container { background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
        .form-control, .form-select { border-radius: 8px; padding: 12px; border: 1px solid #cbd5e1; background-color: #f8fafc; font-weight: 500; }
        .industrial-switch { background-color: #ffffff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 15px 20px; }
        .form-check-input { width: 3em !important; height: 1.5em !important; cursor: pointer; }
        .btn-submit { background: #1e293b; color: white; border: none; border-radius: 10px; padding: 14px; font-weight: 600; width: 100%; }
        .btn-submit:hover { background: #0f172a; color: #fff; }
    </style>
</head>
<body>

<nav class="navbar navbar-custom navbar-dark py-3 px-4 shadow-sm mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold fs-4">
            <i class="fa-solid fa-pen-to-square text-warning me-2"></i> Arıza Kaydı Düzenleme Ekranı
        </span>
        <a href="/admin" class="btn btn-outline-light btn-sm px-3">Geri Dön</a>
    </div>
</nav>

<div class="container mb-5">
    <div class="terminal-container p-4 p-md-5">
        <form th:action="@{/guncelle/{id}(id=${arizaKaydi.id})}" th:object="${arizaKaydi}" method="post">
            <div class="row g-5">
                <div class="col-lg-7">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">Arıza Bilgileri</h5>
                    
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary">Üretim Hattı</label>
                            <select th:field="*{uretimHatti}" class="form-select" required>
                                <option value="Keçe">Keçe Hattı</option>
                                <option value="Fitil">Fitil İşleme</option>
                                <option value="Kırma">Kırma Hattı</option>
                                <option value="WR">WR Hattı</option>
                                <option value="Diğer">Diğer</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary">Arıza Kategorisi</label>
                            <select th:field="*{arizaTuru}" class="form-select" required>
                                <option value="Mekanik">Mekanik</option>
                                <option value="Elektrik">Elektrik</option>
                                <option value="Otomasyon">Otomasyon / Sensör</option>
                                <option value="Diğer">Diğer</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary">Arıza Açıklaması</label>
                        <textarea th:field="*{arizaAciklamasi}" class="form-control" rows="4" required></textarea>
                    </div>
                </div>

                <div class="col-lg-5">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">Kritik Parametreler (Puanı Etkiler)</h5>
                    <div class="d-flex flex-column gap-3 mb-4">
                        <div class="industrial-switch form-check form-switch d-flex align-items-center justify-content-between m-0">
                            <label class="form-check-label fw-bold text-dark" for="isgCheck">İSG Riski</label>
                            <input class="form-check-input m-0" type="checkbox" th:field="*{isgRiskiVarMi}" id="isgCheck">
                        </div>
                        <div class="industrial-switch form-check form-switch d-flex align-items-center justify-content-between m-0">
                            <label class="form-check-label fw-bold text-dark" for="durusCheck">Makine Duruşu</label>
                            <input class="form-check-input m-0" type="checkbox" th:field="*{durusVarMi}" id="durusCheck">
                        </div>
                        <div class="industrial-switch form-check form-switch d-flex align-items-center justify-content-between m-0">
                            <label class="form-check-label fw-bold text-dark" for="disaCheck">Parça / Servis</label>
                            <input class="form-check-input m-0" type="checkbox" th:field="*{disaBagimliMi}" id="disaCheck">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-submit shadow">
                        <i class="fa-solid fa-floppy-disk me-2"></i> Değişiklikleri Kaydet
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>
