<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arıza Bildir - Fabrika OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); background-attachment: fixed; color: #334155; }
        .glass-panel { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07); }
        .navbar-custom { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.6); }
        .form-control, .form-select { background-color: rgba(255,255,255,0.6) !important; border: 1px solid rgba(255,255,255,0.9) !important; color: #334155 !important; }
        .form-control:focus, .form-select:focus { background-color: rgba(255,255,255,0.9) !important; border-color: #38bdf8 !important; box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25) !important; }
        .btn-modern { border-radius: 10px; font-weight: 600; padding: 12px 20px; transition: all 0.3s; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); border: none; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.2); }
        .btn-modern:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
<nav class="navbar navbar-custom py-3 px-4 shadow-sm mb-5">
    <div class="container">
        <span class="navbar-brand mb-0 h1 fw-bold fs-4 text-dark">
            <i class="fa-solid fa-helmet-safety text-primary me-2"></i> Saha Personeli Paneli
        </span>
        <div class="d-flex align-items-center gap-3">
            <span class="text-dark fw-medium">
                <i class="fa-regular fa-circle-user me-1 text-primary"></i> <span th:text="${session.aktifKullanici.adSoyad}"></span>
            </span>
            <a href="/logout" class="btn btn-outline-danger fw-bold btn-sm" style="border-radius: 8px; border-width: 2px;">Çıkış</a>
        </div>
    </div>
</nav>
<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div th:if="${param.basarili}" class="alert alert-success text-white border-0 fw-bold mb-4 shadow-sm" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); border-radius: 10px;">
                <i class="fa-solid fa-circle-check me-2"></i> Arıza kaydınız başarıyla oluşturuldu ve teknik ekibe iletildi.
            </div>
            <div class="glass-panel p-5">
                <h4 class="fw-bold text-dark mb-4"><i class="fa-solid fa-triangle-exclamation text-warning me-2"></i>Yeni Arıza Bildirimi</h4>
                <form action="/kaydet" method="post">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">ÜRETİM HATTI</label>
                            <select name="uretimHatti" class="form-select" required>
                                <option value="">Hat Seçiniz...</option>
                                <option value="Keçe">Keçe Hattı</option>
                                <option value="Fitil">Fitil Hattı</option>
                                <option value="Kırma">Kırma Hattı</option>
                                <option value="WR">WR Hattı</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small fw-bold">ARIZA TÜRÜ</label>
                            <select name="arizaTuru" class="form-select" id="arizaTuruSecici" required onchange="turKontrol()">
                                <option value="">Tür Seçiniz...</option>
                                <option value="Mekanik">Mekanik</option>
                                <option value="Elektrik">Elektrik</option>
                                <option value="Otomasyon">Otomasyon</option>
                                <option value="Diğer">Diğer</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3" id="digerKutusu" style="display: none;">
                        <label class="form-label text-muted small fw-bold">DİĞER ARIZA TÜRÜ</label>
                        <input type="text" name="arizaTuruDiger" class="form-control" placeholder="Lütfen arıza türünü belirtin">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">ARIZA AÇIKLAMASI VE DETAYLAR</label>
                        <textarea name="arizaAciklamasi" class="form-control" rows="4" placeholder="Arızayı detaylı bir şekilde açıklayınız..." required></textarea>
                    </div>
                    <div class="p-3 mb-4 rounded" style="background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.9);">
                        <h6 class="fw-bold text-primary mb-3">Kritik Durum Parametreleri</h6>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input shadow-sm" type="checkbox" name="isgRiskiVarMi" id="isg">
                            <label class="form-check-label text-dark fw-medium" for="isg">İş Sağlığı ve Güvenliği (İSG) Riski Var Mı?</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input shadow-sm" type="checkbox" name="durusVarMi" id="durus">
                            <label class="form-check-label text-dark fw-medium" for="durus">Üretimde Duruş / Kesinti Var Mı?</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input shadow-sm" type="checkbox" name="disaBagimliMi" id="dis">
                            <label class="form-check-label text-dark fw-medium" for="dis">Dışa Bağımlı Bir Müdahale Gerekiyor Mu?</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-modern text-white">Arızayı Sisteme Kaydet</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    function turKontrol() {
        var secici = document.getElementById("arizaTuruSecici");
        var digerKutusu = document.getElementById("digerKutusu");
        if(secici.value === "Diğer") {
            digerKutusu.style.display = "block";
        } else {
            digerKutusu.style.display = "none";
        }
    }
</script>
</body>
</html>
