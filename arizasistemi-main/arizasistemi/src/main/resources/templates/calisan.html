<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Arıza Bildir - Fabrika OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0b1121; color: #e2e8f0; }
        .navbar-custom { background: #0f172a; border-bottom: 1px solid #1e293b; }
        .form-card { background: #1e293b; border-radius: 15px; padding: 30px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .form-control, .form-select { background-color: #0f172a !important; border: 1px solid #334155 !important; color: #f8fafc !important; }
        .form-control:focus, .form-select:focus { border-color: #38bdf8 !important; box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25) !important; }
        .form-check-input { background-color: #0f172a; border-color: #334155; }
        .form-check-input:checked { background-color: #3b82f6; border-color: #3b82f6; }
        .btn-modern { border-radius: 10px; font-weight: 600; padding: 12px 20px; transition: all 0.3s; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); border: none; }
    </style>
</head>
<body>

<nav class="navbar navbar-custom navbar-dark py-3 px-4 shadow-sm mb-5">
    <div class="container">
        <span class="navbar-brand mb-0 h1 fw-bold fs-4">
            <i class="fa-solid fa-helmet-safety text-info me-2"></i> Saha Personeli Paneli
        </span>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white fw-medium">
                <i class="fa-regular fa-circle-user me-1 text-info"></i> <span th:text="${session.aktifKullanici.adSoyad}"></span>
            </span>
            <a href="/logout" class="btn btn-outline-danger fw-bold btn-sm" style="border-radius: 8px;">Çıkış</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            
            <div th:if="${param.basarili}" class="alert alert-success bg-success text-white border-0 fw-bold mb-4" style="border-radius: 10px;">
                <i class="fa-solid fa-circle-check me-2"></i> Arıza kaydınız başarıyla oluşturuldu ve teknik ekibe iletildi.
            </div>

            <div class="form-card">
                <h4 class="fw-bold text-white mb-4"><i class="fa-solid fa-triangle-exclamation text-warning me-2"></i>Yeni Arıza Bildirimi</h4>
                <form action="/kaydet" method="post">
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-secondary small fw-bold">ÜRETİM HATTI</label>
                            <select name="uretimHatti" class="form-select" required>
                                <option value="">Hat Seçiniz...</option>
                                <option value="Keçe">Keçe Hattı</option>
                                <option value="Fitil">Fitil Hattı</option>
                                <option value="Kırma">Kırma Hattı</option>
                                <option value="WR">WR Hattı</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-secondary small fw-bold">ARIZA TÜRÜ</label>
                            <select name="arizaTuru" class="form-select" id="arizaTuruSecici" required onchange="turKontrol()">
                                <option value="">Tür Seçiniz...</option>
                                <option value="Mekanik">Mekanik</option>
                                <option value="Elektrik">Elektrik</option>
                                <option value="Otomasyon">Otomasyon</option>
                                <option value="Diğer">Diğer</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3" id="digerKutusu" style="display: none;">
                        <label class="form-label text-secondary small fw-bold">DİĞER ARIZA TÜRÜ</label>
                        <input type="text" name="arizaTuruDiger" class="form-control" placeholder="Lütfen arıza türünü belirtin">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-bold">ARIZA AÇIKLAMASI VE DETAYLAR</label>
                        <textarea name="arizaAciklamasi" class="form-control" rows="4" placeholder="Arızayı detaylı bir şekilde açıklayınız..." required></textarea>
                    </div>

                    <div class="p-3 mb-4 rounded" style="background: rgba(255,255,255,0.02); border: 1px solid #334155;">
                        <h6 class="fw-bold text-info mb-3">Kritik Durum Parametreleri</h6>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" name="isgRiskiVarMi" id="isg">
                            <label class="form-check-label text-light" for="isg">İş Sağlığı ve Güvenliği (İSG) Riski Var Mı?</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" name="durusVarMi" id="durus">
                            <label class="form-check-label text-light" for="durus">Üretimde Duruş / Kesinti Var Mı?</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="disaBagimliMi" id="dis">
                            <label class="form-check-label text-light" for="dis">Dışa Bağımlı Bir Müdahale Gerekiyor Mu?</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-modern text-white">Arızayı Sisteme Kaydet</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function turKontrol() {
        var secici = document.getElementById("arizaTuruSecici");
        var digerKutusu = document.getElementById("digerKutusu");
        if(secici.value === "Diğer") {
            digerKutusu.style.display = "block";
        } else {
            digerKutusu.style.display = "none";
        }
    }
</script>
</body>
</html>
