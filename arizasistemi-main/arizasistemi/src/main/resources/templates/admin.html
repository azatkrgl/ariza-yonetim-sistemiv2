<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Fabrika Arıza İzleme Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); background-attachment: fixed; color: #334155; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07); }
        
        .navbar-custom { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.6); }
        .table thead { font-size: 0.85rem; text-transform: uppercase; color: #64748b;}
        .table thead th { border-bottom: 2px solid rgba(0,0,0,0.05); }
        .table tbody tr { transition: all 0.2s; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .table tbody tr:hover { background-color: rgba(255,255,255,0.4); }
        .badge-custom { padding: 6px 12px; border-radius: 30px; font-weight: 600; font-size: 0.8rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
        .btn-delete { background-color: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); font-weight: 600; border-radius: 8px; transition: all 0.2s; }
        .btn-delete:hover { background-color: #10b981; color: #ffffff; }
    </style>
</head>
<body>

<nav class="navbar navbar-custom py-3 px-4 shadow-sm mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold fs-4 text-dark">
            <i class="fa-solid fa-industry text-primary me-2"></i> Fabrika Arıza İzleme Paneli
        </span>
        <div class="d-flex align-items-center gap-3">
            <span class="text-dark fw-medium">
                <i class="fa-solid fa-user-shield me-1 text-primary"></i> 
                <span th:text="${session.aktifKullanici.adSoyad}"></span> 
                <span class="badge bg-white text-dark border ms-1 fw-bold" style="font-size: 0.7rem;">Yönetici</span>
            </span>

            <a href="/analiz" class="btn btn-primary fw-bold px-3 py-2 shadow-sm rounded-3 btn-sm" style="border: none; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);">
                <i class="fa-solid fa-chart-pie me-1"></i> Analiz & Raporlar
            </a>
            <a href="/logout" class="btn btn-danger fw-bold px-3 py-2 shadow-sm rounded-3 btn-sm" style="background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); border: none;">
                <i class="fa-solid fa-right-from-bracket me-1"></i> Çıkış
            </a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="glass-panel p-4">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th>Tarih/Saat</th>
                        <th>İhbar Eden Personel (Sicil)</th>
                        <th>Sorunlu Hat</th>
                        <th>Kategori</th>
                        <th style="max-width: 250px;">Arıza Açıklaması</th>
                        <th>Kritik Drm.</th>
                        <th class="text-center">Puan</th>
                        <th class="text-center">İşlem</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="kayit : ${kayitlar}">
                        <td class="text-muted small fw-medium" th:text="${kayit.arizaTarihiSaati}"></td>
                        <td>
                            <div class="fw-bold text-primary" th:text="${kayit.bildirenKullanici.adSoyad}"></div>
                            <span class="text-muted small fw-medium"><i class="fa-solid fa-id-card me-1"></i>Sicil: <span th:text="${kayit.bildirenKullanici.sicilNo}"></span></span>
                        </td>
                        <td>
                            <span class="badge bg-white text-dark border fw-bold shadow-sm" th:text="${kayit.uretimHatti}"></span>
                        </td>
                        <td>
                            <span class="fw-bold text-secondary" th:text="${kayit.arizaTuru}"></span>
                            <div th:if="${kayit.arizaTuru == 'Diğer'}" class="text-primary small fw-bold" th:text="'Tür: ' + ${kayit.arizaTuruDiger}"></div>
                        </td>
                        <td style="max-width: 250px;">
                            <span class="small fw-medium text-dark" th:text="${kayit.arizaAciklamasi}"></span>
                        </td>
                        <td>
                            <span th:if="${kayit.isgRiskiVarMi}" class="badge bg-danger text-white rounded-pill shadow-sm">İSG</span>
                            <span th:if="${kayit.durusVarMi}" class="badge bg-warning text-dark border border-warning rounded-pill shadow-sm">Duruş</span>
                        </td>
                        <td class="text-center">
                            <div class="fs-5 fw-bold text-dark" th:text="${kayit.oncelikPuani}"></div>
                            <span th:if="${kayit.oncelikPuani >= 80}" class="badge-custom bg-danger text-white" th:text="${kayit.oncelikSeviyesi}"></span>
                            <span th:if="${kayit.oncelikPuani >= 50 and kayit.oncelikPuani lt 80}" class="badge-custom bg-warning text-dark" th:text="${kayit.oncelikSeviyesi}"></span>
                            <span th:if="${kayit.oncelikPuani >= 30 and kayit.oncelikPuani lt 50}" class="badge-custom bg-info text-dark" th:text="${kayit.oncelikSeviyesi}"></span>
                            <span th:if="${kayit.oncelikPuani lt 30}" class="badge-custom bg-secondary text-white" th:text="${kayit.oncelikSeviyesi}"></span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/duzenle/{id}(id=${kayit.id})}" class="btn btn-warning btn-sm px-2 py-2 me-1 text-dark fw-bold border-0 shadow-sm" title="Düzenle">
                               <i class="fa-solid fa-pen"></i>
                            </a>
                            <a th:href="@{/cozuldu/{id}(id=${kayit.id})}" class="btn btn-delete btn-sm px-3 py-2 shadow-sm" onclick="return confirm('Bu arızayı çözüldü olarak arşivlemek istediğinize emin misiniz?')">
                               <i class="fa-solid fa-check-double me-1"></i> Çözüldü
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
