<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sisteme Giriş - Kurumsal Arıza Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #ffffff; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 400px; overflow: hidden; }
        .login-header { background-color: #f8fafc; padding: 30px; text-align: center; border-bottom: 1px solid #e2e8f0; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-header">
        <i class="fa-solid fa-id-badge fs-1 text-primary mb-3"></i>
        <h4 class="fw-bold mb-1">Kurumsal Giriş</h4>
        <p class="text-muted small mb-0">Sicil No ve Şifreniz ile giriş yapınız.</p>
    </div>
    <div class="p-4 p-md-5">
        <div th:if="${hata}" class="alert alert-danger p-2 text-center small fw-bold" th:text="${hata}"></div>
        <form th:action="@{/login-kontrol}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">Sicil Numaranız</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" name="sicilNo" class="form-control border-start-0 bg-light" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small">Erişim Şifresi</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                    <input type="password" name="sifre" class="form-control border-start-0 bg-light" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">Sisteme Giriş Yap</button>
        </form>
    </div>
</div>
</body>
</html>
