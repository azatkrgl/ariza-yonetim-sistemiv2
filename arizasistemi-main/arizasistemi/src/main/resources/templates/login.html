<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Fabrika Arıza Sistemi - Giriş</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0b1121; color: #e2e8f0; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #1e293b; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid #334155; padding: 40px; width: 100%; max-width: 400px; }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header i { font-size: 3rem; color: #38bdf8; margin-bottom: 15px; }
        .form-control { background-color: #0f172a !important; border: 1px solid #334155 !important; color: #f8fafc !important; padding: 12px 15px; border-radius: 10px; }
        .form-control:focus { border-color: #38bdf8 !important; box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25) !important; }
        .btn-login { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); border: none; font-weight: 600; padding: 12px; border-radius: 10px; transition: transform 0.2s; }
        .btn-login:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <i class="fa-solid fa-bolt"></i>
            <h4 class="fw-bold text-white">Fabrika <span class="text-info">OS</span></h4>
            <p class="text-secondary small">Sisteme giriş yapmak için bilgilerinizi girin</p>
        </div>

        <div th:if="${hata}" class="alert alert-danger text-center fw-bold border-0 bg-danger text-white py-2" style="border-radius: 10px;">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> <span th:text="${hata}"></span>
        </div>

        <form action="/login-kontrol" method="post">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">SİCİL NO</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-id-badge"></i></span>
                    <input type="text" name="sicilNo" class="form-control" placeholder="Sicil numaranızı girin" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">ŞİFRE</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="sifre" class="form-control" placeholder="Şifrenizi girin" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-login">Sisteme Giriş Yap</button>
        </form>
    </div>

</body>
</html>
