<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Analiz & Raporlar - Fabrika OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); background-attachment: fixed; color: #334155; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07); }
        .navbar-custom { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.6); }
        
        .table thead { font-size: 0.85rem; text-transform: uppercase; color: #64748b;}
        .table thead th { border-bottom: 2px solid rgba(0,0,0,0.05); }
        .table tbody tr { transition: all 0.2s; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .table tbody tr:hover { background-color: rgba(255,255,255,0.4); }
        .badge-custom { padding: 6px 12px; border-radius: 30px; font-weight: 600; font-size: 0.8rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
    </style>
</head>
<body>

<nav class="navbar navbar-custom py-3 px-4 shadow-sm mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold fs-4 text-dark">
            <i class="fa-solid fa-chart-pie text-primary me-2"></i> Canlı Analiz & Performans Raporları
        </span>
        <div class="d-flex align-items-center gap-3">
            <a href="javascript:history.back()" class="btn btn-light fw-bold px-3 py-2 rounded-3 btn-sm border shadow-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Geri Dön
            </a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 pb-5">
    
    <!-- Dinamik Grafiklerin Yer Aldığı Alan (Pasta ve Sütun Grafikleri) -->
    <div class="row mb-4">
        <div class="col-md-6 mb-3 mb-md-0">
            <div class="glass-panel p-4 h-100">
                <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-chart-bar text-primary me-2"></i>Üretim Hatlarına Göre Arıza Dağılımı</h5>
                <div style="position: relative; height: 280px; width: 100%;">
                    <canvas id="hatGrafigi"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="glass-panel p-4 h-100">
                <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-chart-pie text-success me-2"></i>Arıza Türleri (Pasta Analizi)</h5>
                <div style="position: relative; height: 280px; width: 100%;">
                    <canvas id="turGrafigi"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Geçmiş / Çözülen Arızalar Tablosu -->
    <div class="glass-panel p-4">
        <h5 class="fw-bold text-dark mb-4"><i class="fa-solid fa-clock-rotate-left text-success me-2"></i>Geçmiş (Çözülen) Arızalar Arşivi</h5>
        
        <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
            <table class="table align-middle mb-0">
                <thead class="sticky-top" style="background: rgba(245, 247, 250, 0.9);">
                    <tr>
                        <th>Tarih/Saat</th>
                        <th>İhbar Eden Personel</th>
                        <th>Sorunlu Hat</th>
                        <th>Kategori</th>
                        <th style="max-width: 300px;">Arıza Açıklaması</th>
                        <th class="text-center">Öncelik Puanı</th>
                        <th class="text-center">Durum</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="kayit : ${gecmisKayitlar}">
                        <td class="text-muted small fw-medium" th:text="${kayit.arizaTarihiSaati}"></td>
                        <td>
                            <div class="fw-bold text-primary" th:text="${kayit.bildirenKullanici.adSoyad}"></div>
                            <span class="text-muted small fw-medium">Sicil: <span th:text="${kayit.bildirenKullanici.sicilNo}"></span></span>
                        </td>
                        <td>
                            <span class="badge bg-white text-dark border fw-bold shadow-sm" th:text="${kayit.uretimHatti}"></span>
                        </td>
                        <td>
                            <span class="fw-bold text-secondary" th:text="${kayit.arizaTuru}"></span>
                            <div th:if="${kayit.arizaTuru == 'Diğer'}" class="text-primary small fw-bold" th:text="'Tür: ' + ${kayit.arizaTuruDiger}"></div>
                        </td>
                        <td class="small fw-medium text-dark" style="max-width: 300px;">
                            <span th:text="${kayit.arizaAciklamasi}"></span>
                        </td>
                        <td class="text-center">
                            <div class="fs-6 fw-bold text-dark" th:text="${kayit.oncelikPuani}"></div>
                        </td>
                        <td class="text-center">
                            <span class="badge bg-success badge-custom"><i class="fa-solid fa-check-double me-1"></i>Çözüldü</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Java'dan Gelen Gerçek Verileri Chart.js'e Aktaran Script -->
<script th:inline="javascript">
    const kec = /*[[${keceSayisi}]]*/ 0;
    const fit = /*[[${fitilSayisi}]]*/ 0;
    const kir = /*[[${kirmaSayisi}]]*/ 0;
    const wrh = /*[[${wrSayisi}]]*/ 0;

    const mek = /*[[${mSayisi}]]*/ 0;
    const elk = /*[[${elektrikSayisi}]]*/ 0;
    const oto = /*[[${otomasyonSayisi}]]*/ 0;
    const dig = /*[[${digerSayisi}]]*/ 0;

    // Üretim Hatları Çubuk Grafiği
    const ctxHat = document.getElementById('hatGrafigi').getContext('2d');
    new Chart(ctxHat, {
        type: 'bar',
        data: {
            labels: ['Keçe', 'Fitil', 'Kırma', 'WR'],
            datasets: [{
                label: 'Arıza Sayısı',
                data: [kec, fit, kir, wrh],
                backgroundColor: 'rgba(2, 132, 199, 0.7)',
                borderColor: 'rgba(2, 132, 199, 1)',
                borderWidth: 1,
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } }, x: { grid: { display: false } } }
        }
    });

    // Arıza Türleri Pasta Grafiği (Doughnut)
    const ctxTur = document.getElementById('turGrafigi').getContext('2d');
    new Chart(ctxTur, {
        type: 'doughnut',
        data: {
            labels: ['Mekanik', 'Elektrik', 'Otomasyon', 'Diğer'],
            datasets: [{
                data: [mek, elk, oto, dig],
                backgroundColor: ['#0284c7', '#10b981', '#f59e0b', '#64748b'],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } }
        }
    });
</script>
</body>
</html>
