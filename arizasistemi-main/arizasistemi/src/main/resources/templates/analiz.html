<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Analiz & Raporlar - Fabrika OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); background-attachment: fixed; color: #334155; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 16px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07); }
        .navbar-custom { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.6); }
        
        .table thead { font-size: 0.85rem; text-transform: uppercase; color: #64748b;}
        .table thead th { border-bottom: 2px solid rgba(0,0,0,0.05); }
        .table tbody tr { transition: all 0.2s; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .table tbody tr:hover { background-color: rgba(255,255,255,0.4); }
        .badge-custom { padding: 6px 12px; border-radius: 30px; font-weight: 600; font-size: 0.8rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
    </style>
</head>
<body>

<nav class="navbar navbar-custom py-3 px-4 shadow-sm mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold fs-4 text-dark">
            <i class="fa-solid fa-chart-pie text-primary me-2"></i> Çözülmüş Arıza Geçmişi
        </span>
        <div class="d-flex align-items-center gap-3">
            <a href="/admin" class="btn btn-light fw-bold px-3 py-2 rounded-3 btn-sm border shadow-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Panele Dön
            </a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="glass-panel p-4">
        
        <h5 class="fw-bold text-dark mb-4"><i class="fa-solid fa-clock-rotate-left text-success me-2"></i>Geçmiş (Çözülen) Arızalar Arşivi</h5>
        
        <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
            <table class="table align-middle mb-0">
                <thead class="sticky-top" style="background: rgba(245, 247, 250, 0.9);">
                    <tr>
                        <th>Tarih/Saat</th>
                        <th>İhbar Eden Personel</th>
                        <th>Sorunlu Hat</th>
                        <th>Kategori</th>
                        <th style="max-width: 300px;">Arıza Açıklaması</th>
                        <th class="text-center">Öncelik Puanı</th>
                        <th class="text-center">Durum</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="kayit : ${gecmisKayitlar}">
                        <td class="text-muted small fw-medium" th:text="${kayit.arizaTarihiSaati}"></td>
                        <td>
                            <div class="fw-bold text-primary" th:text="${kayit.bildirenKullanici.adSoyad}"></div>
                            <span class="text-muted small fw-medium">Sicil: <span th:text="${kayit.bildirenKullanici.sicilNo}"></span></span>
                        </td>
                        <td>
                            <span class="badge bg-white text-dark border fw-bold shadow-sm" th:text="${kayit.uretimHatti}"></span>
                        </td>
                        <td>
                            <span class="fw-bold text-secondary" th:text="${kayit.arizaTuru}"></span>
                            <div th:if="${kayit.arizaTuru == 'Diğer'}" class="text-primary small fw-bold" th:text="'Tür: ' + ${kayit.arizaTuruDiger}"></div>
                        </td>
                        <td class="small fw-medium text-dark" style="max-width: 300px;">
                            <span th:text="${kayit.arizaAciklamasi}"></span>
                        </td>
                        <td class="text-center">
                            <div class="fs-6 fw-bold text-dark" th:text="${kayit.oncelikPuani}"></div>
                        </td>
                        <td class="text-center">
                            <span class="badge bg-success badge-custom"><i class="fa-solid fa-check-double me-1"></i>Çözüldü</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
