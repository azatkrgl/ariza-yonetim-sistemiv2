<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Analiz & Raporlar - Fabrika Arıza Sistemi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; color: #333; }
        .navbar-custom { background: linear-gradient(135deg, #312e81 0%, #1e1b4b 100%); }
        .dashboard-card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: none; height: 100%; }
        .chart-container { position: relative; height: 300px; width: 100%; padding: 15px; }
        .table-container { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: none; }
        .table thead { background-color: #f8fafc; color: #475569; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
        .kpi-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 1.5rem; }
        .btn-excel { background-color: #16a34a; color: white; border: none; transition: all 0.2s; }
        .btn-excel:hover { background-color: #15803d; color: white; transform: translateY(-2px); }
    </style>
</head>
<body>

<nav class="navbar navbar-custom navbar-dark py-3 px-4 shadow-sm mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold fs-4">
            <i class="fa-solid fa-chart-pie text-info me-2"></i> Sürekli İyileştirme Paneli
        </span>
        <a href="/admin" class="btn btn-light fw-bold px-3 py-2 shadow-sm rounded-3 text-primary">
            <i class="fa-solid fa-arrow-left me-1"></i> Admin'e Dön
        </a>
    </div>
</nav>

<div class="container-fluid px-4 mb-5">
    
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="dashboard-card p-4 d-flex align-items-center">
                <div class="kpi-icon bg-success bg-opacity-10 text-success me-3">
                    <i class="fa-solid fa-check-double"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1 fw-semibold">Toplam Çözülen Arıza</h6>
                    <h3 class="mb-0 fw-bold" th:text="${#lists.size(gecmisKayitlar)}">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="dashboard-card p-4 d-flex align-items-center border-start border-4 border-danger">
                <div class="kpi-icon bg-danger bg-opacity-10 text-danger me-3">
                    <i class="fa-solid fa-fire-flame-curved"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1 fw-semibold">Darboğaz (En Sorunlu Hat)</h6>
                    <h3 class="mb-0 fw-bold text-danger" id="kpi-darbogaz">-</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="dashboard-card p-4 d-flex align-items-center border-start border-4 border-warning">
                <div class="kpi-icon bg-warning bg-opacity-10 text-warning me-3">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1 fw-semibold">Kök Neden (Sık Görülen)</h6>
                    <h3 class="mb-0 fw-bold text-warning-emphasis" id="kpi-kokneden">-</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="dashboard-card p-4">
                <h5 class="fw-bold text-secondary mb-3"><i class="fa-solid fa-chart-simple me-2"></i>Hat Bazlı Arıza Dağılımı</h5>
                <div class="chart-container">
                    <canvas id="hatGrafigi"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="dashboard-card p-4">
                <h5 class="fw-bold text-secondary mb-3"><i class="fa-solid fa-chart-column me-2"></i>Pareto: Arıza Kök Nedenleri</h5>
                <div class="chart-container">
                    <canvas id="turGrafigi"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="table-container p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <div>
                <h5 class="fw-bold text-secondary mb-0"><i class="fa-solid fa-database me-2"></i>Geçmiş Veri Arşivi</h5>
            </div>
            <button onclick="excelIndir()" class="btn btn-excel fw-bold shadow-sm rounded-3 px-3 py-2">
                <i class="fa-solid fa-file-excel me-2"></i> Excel'e Aktar (.xlsx)
            </button>
        </div>
        
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="arizaTablosu">
                <thead>
                    <tr>
                        <th>Tarih/Saat</th>
                        <th>Bildiren Personel</th>
                        <th>Sorunlu Hat</th>
                        <th>Kategori</th>
                        <th style="max-width: 300px;">Detaylı Açıklama</th>
                        <th class="text-center">Öncelik Puanı</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="kayit : ${gecmisKayitlar}">
                        <td th:text="${kayit.arizaTarihiSaati}"></td>
                        <td class="fw-bold text-primary" th:text="${kayit.bildirenKullanici.adSoyad}"></td>
                        <td><span class="badge bg-dark fw-normal hat-veri" th:text="${kayit.uretimHatti}"></span></td>
                        <td>
                            <span class="tur-veri fw-medium" th:text="${kayit.arizaTuru}"></span>
                            <span th:if="${kayit.arizaTuru == 'Diğer'}" th:text="' - ' + ${kayit.arizaTuruDiger}"></span>
                        </td>
                        <td style="max-width: 300px;">
                            <span class="small text-muted" th:text="${kayit.arizaAciklamasi}"></span>
                        </td>
                        <td class="text-center fw-bold text-muted" th:text="${kayit.oncelikPuani}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(gecmisKayitlar)}" class="bos-kayit">
                        <td colspan="6" class="text-center text-muted py-4">Veri bulunamadı.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function excelIndir() {
    var tablo = document.getElementById("arizaTablosu");
    var workbook = XLSX.utils.table_to_book(tablo, { sheet: "Geçmiş Arızalar" });
    XLSX.writeFile(workbook, "Fabrika_Ariza_Raporu.xlsx");
}

document.addEventListener('DOMContentLoaded', function() {
    const hatVerileri = document.querySelectorAll('.hat-veri');
    const turVerileri = document.querySelectorAll('.tur-veri');
    
    if(hatVerileri.length === 0) return;

    let hatSayilari = {};
    let turSayilari = {};

    hatVerileri.forEach(el => {
        let isim = el.innerText.trim();
        hatSayilari[isim] = (hatSayilari[isim] || 0) + 1;
    });

    turVerileri.forEach(el => {
        let isim = el.innerText.trim();
        if(isim.includes('Diğer')) isim = 'Diğer'; 
        turSayilari[isim] = (turSayilari[isim] || 0) + 1;
    });

    let enSorunluHat = Object.keys(hatSayilari).reduce((a, b) => hatSayilari[a] > hatSayilari[b] ? a : b);
    let enSikTur = Object.keys(turSayilari).reduce((a, b) => turSayilari[a] > turSayilari[b] ? a : b);
    
    document.getElementById('kpi-darbogaz').innerText = enSorunluHat;
    document.getElementById('kpi-kokneden').innerText = enSikTur;

    new Chart(document.getElementById('hatGrafigi'), {
        type: 'doughnut',
        data: {
            labels: Object.keys(hatSayilari),
            datasets: [{
                data: Object.values(hatSayilari),
                backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#10b981', '#6366f1'],
                borderWidth: 0
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
    });

    new Chart(document.getElementById('turGrafigi'), {
        type: 'bar',
        data: {
            labels: Object.keys(turSayilari),
            datasets: [{
                label: 'Arıza Sayısı',
                data: Object.values(turSayilari),
                backgroundColor: '#3b82f6',
                borderRadius: 6
            }]
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
    });
});
</script>

</body>
</html>
