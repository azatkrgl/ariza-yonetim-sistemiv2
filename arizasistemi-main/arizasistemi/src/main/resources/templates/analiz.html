<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Analiz & Raporlar - Fabrika OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1121; color: #e2e8f0; }
        .navbar-custom { background: linear-gradient(135deg, #0f172a 0%, #020617 100%); border-bottom: 1px solid #1e293b; }
        .table-container { background: #1e293b; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .table thead { background-color: #0f172a; color: #94a3b8; border-bottom: 2px solid #334155;}
        .table-hover tbody tr { border-bottom: 1px solid #334155; }
        .table-hover tbody tr:hover { background-color: #0f172a; }
        .badge-custom { padding: 6px 12px; border-radius: 30px; font-weight: 600; font-size: 0.8rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-custom navbar-dark py-3 px-4 shadow-sm mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold fs-4">
            <i class="fa-solid fa-chart-pie text-info me-2"></i> Çözülmüş Arıza Geçmişi
        </span>
        <div class="d-flex align-items-center gap-3">
            <a href="/admin" class="btn btn-outline-light fw-bold px-3 py-2 rounded-3 btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Panele Dön
            </a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="table-container p-4">
        
        <h5 class="fw-bold text-white mb-4"><i class="fa-solid fa-clock-rotate-left text-success me-2"></i>Geçmiş (Çözülen) Arızalar Arşivi</h5>
        
        <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
            <table class="table table-hover align-middle mb-0 text-light">
                <thead class="sticky-top">
                    <tr>
                        <th>Tarih/Saat</th>
                        <th>İhbar Eden Personel</th>
                        <th>Sorunlu Hat</th>
                        <th>Kategori</th>
                        <th style="max-width: 300px;">Arıza Açıklaması</th>
                        <th class="text-center">Öncelik Puanı</th>
                        <th class="text-center">Durum</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="kayit : ${gecmisKayitlar}">
                        <td class="text-secondary small" th:text="${kayit.arizaTarihiSaati}"></td>
                        <td>
                            <div class="fw-bold text-info" th:text="${kayit.bildirenKullanici.adSoyad}"></div>
                            <span class="text-secondary small">Sicil: <span th:text="${kayit.bildirenKullanici.sicilNo}"></span></span>
                        </td>
                        <td>
                            <span class="badge bg-dark text-light border border-secondary fw-normal" th:text="${kayit.uretimHatti}"></span>
                        </td>
                        <td>
                            <span class="fw-medium" th:text="${kayit.arizaTuru}"></span>
                            <div th:if="${kayit.arizaTuru == 'Diğer'}" class="text-info small fw-bold" th:text="'Tür: ' + ${kayit.arizaTuruDiger}"></div>
                        </td>
                        <td style="max-width: 300px;">
                            <span class="small" th:text="${kayit.arizaAciklamasi}"></span>
                        </td>
                        <td class="text-center">
                            <div class="fs-6 fw-bold text-secondary" th:text="${kayit.oncelikPuani}"></div>
                        </td>
                        <td class="text-center">
                            <span class="badge bg-success badge-custom"><i class="fa-solid fa-check-double me-1"></i>Çözüldü</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
